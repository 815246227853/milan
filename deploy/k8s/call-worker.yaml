# Call workers run the phone calls. NudgeBee watches these pods; in the demo we delete one mid-job.
apiVersion: apps/v1
kind: Deployment
metadata: { name: milan-call-worker, labels: { app: milan-call-worker } }
spec:
  replicas: 3
  selector: { matchLabels: { app: milan-call-worker } }
  template:
    metadata: { labels: { app: milan-call-worker } }
    spec:
      containers:
        - name: call-worker
          image: milan-call-worker
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4100 }]
          envFrom: [{ secretRef: { name: milan-env } }]
          livenessProbe: { httpGet: { path: /health, port: 4100 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: milan-call-worker }
spec: { selector: { app: milan-call-worker }, ports: [{ port: 4100, targetPort: 4100 }] }
