<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milan · Set up your wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/milan.css">
<style>
body{min-height:100vh}
.top{max-width:1120px;margin:0 auto;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--head)}
.brand span{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:500;letter-spacing:.02em}
.stage{max-width:1120px;margin:0 auto;padding:4px 28px 60px}

/* Steps */
.steps{display:flex;justify-content:center;gap:0;margin:0 auto 26px;max-width:640px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center}
.st::before{content:"";position:absolute;top:7px;left:calc(-50% + 12px);right:calc(50% + 12px);height:1px;background:var(--line)}
.st:first-child::before{display:none}
.st i{width:15px;height:15px;border-radius:50%;border:1px solid var(--gold-l);background:var(--paper-2);transition:all .5s var(--ease)}
.st.on{color:var(--head)}
.st.on i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(164,122,54,.16)}
.st.done i{background:var(--gold-l);border-color:var(--gold-l)}
.st.done::before,.st.on::before{background:var(--gold-l)}

/* The invitation frame */
.frame{position:relative;max-width:880px;margin:0 auto;background:var(--paper-2);border:1px solid var(--line);border-radius:440px 440px 26px 26px/180px 180px 26px 26px;padding:96px 64px 48px;text-align:center;box-shadow:0 40px 80px -40px rgba(90,60,25,.35)}
.frame::before{content:"";position:absolute;inset:10px;border:1px dashed var(--line);border-radius:430px 430px 18px 18px/172px 172px 18px 18px;pointer-events:none}
.frame>*{position:relative}
.q{font-size:clamp(32px,4.4vw,50px);max-width:680px;margin:6px auto 0;min-height:1.1em}
.q .w{display:inline-block;opacity:0;transform:translateY(8px);animation:rise .6s var(--ease) forwards}
.lede{color:var(--ink-2);max-width:520px;margin:12px auto 0}
.talk{display:flex;flex-direction:column;align-items:center;gap:14px;margin:34px 0 10px}
.hint{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:20px}
.heard{max-width:560px;margin:0 auto;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:var(--ink-2);min-height:30px}
.heard::before{content:"“";color:var(--gold)}.heard::after{content:"”";color:var(--gold)}
.heard:empty::before,.heard:empty::after{content:""}

.fields{max-width:620px;margin:22px auto 0;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fields .full{grid-column:1/-1}
.fields label{display:block;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 7px 4px}
.amp{display:flex;align-items:center;gap:10px}
.amp span{font-family:"Great Vibes",cursive;font-size:34px;color:var(--gold);line-height:1}
.prefix{position:relative}.prefix span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}.prefix .input{padding-left:32px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sum{font-size:14px;color:var(--muted);text-align:center;grid-column:1/-1;margin:2px 0 0;min-height:22px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;max-width:620px;margin:30px auto 0}
.err{max-width:620px;margin:16px auto 0;padding:12px 16px;border-radius:14px;background:var(--rose-soft);border:1px solid var(--rose-l);color:var(--rose-d);font-size:14px}

/* Welcome */
.namaste{font-family:"Great Vibes",cursive;font-size:clamp(46px,6vw,68px);color:var(--gold-d);line-height:1;margin:0}
.promise{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:26px 0 0;font-size:14px;color:var(--ink-2)}
.promise span{display:flex;align-items:center;gap:8px}
.promise svg{flex:none}

/* Finale */
.checks{list-style:none;padding:0;margin:26px auto 0;max-width:380px;text-align:left}
.checks li{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--muted);transition:color .4s}
.checks li i{width:20px;height:20px;border-radius:50%;border:1px solid var(--gold-l);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#FBEFD6;transition:all .4s}
.checks li.ok{color:var(--ink)}
.checks li.ok i{background:var(--sage);border-color:var(--sage)}
.invite{max-width:460px;margin:26px auto 0;padding:34px 30px 28px;background:var(--card);border:1px solid var(--line);border-radius:22px;position:relative}
.invite::before{content:"";position:absolute;inset:7px;border:1px solid var(--line-2);border-radius:16px;pointer-events:none}
.invite .names{font-family:"Great Vibes",cursive;font-size:clamp(40px,5vw,54px);color:var(--rose-d);line-height:1.1}
.invite .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.view{animation:rise .7s var(--ease) both}
@media (max-width:700px){
  .top,.stage{padding-left:16px;padding-right:16px}
  .frame{padding:70px 20px 32px;border-radius:220px 220px 20px 20px/110px 110px 20px 20px}
  .frame::before{border-radius:212px 212px 14px 14px/102px 102px 14px 14px}
  .fields{grid-template-columns:1fr}
  .st b{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="lp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9557E"/><stop offset=".55" stop-color="#F3A9BF"/><stop offset="1" stop-color="#FCEAF0"/></linearGradient>
  <symbol id="lotus" overflow="visible"><path d="M0 0 Q4 30 2 60" stroke="#4F7A48" stroke-width="3" fill="none"/><g fill="url(#lp)" stroke="#C94C72" stroke-width=".8"><path transform="rotate(-62)" d="M0 0 Q-11 -20 0 -40 Q11 -20 0 0Z"/><path transform="rotate(62)" d="M0 0 Q-11 -20 0 -40 Q11 -20 0 0Z"/><path transform="rotate(-38)" d="M0 0 Q-13 -24 0 -50 Q13 -24 0 0Z"/><path transform="rotate(38)" d="M0 0 Q-13 -24 0 -50 Q13 -24 0 0Z"/><path transform="rotate(-16)" d="M0 0 Q-14 -27 0 -56 Q14 -27 0 0Z"/><path transform="rotate(16)" d="M0 0 Q-14 -27 0 -56 Q14 -27 0 0Z"/><path d="M0 2 Q-15 -28 0 -60 Q15 -28 0 2Z"/></g><path d="M-16 -2 Q0 8 16 -2" stroke="#E7C24F" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="orn" viewBox="0 0 200 24"><path d="M6 12 H72 M128 12 H194" stroke="#C3A36A" stroke-width="1"/><circle cx="4" cy="12" r="2" fill="#C3A36A"/><circle cx="196" cy="12" r="2" fill="#C3A36A"/><path d="M78 12 l6 -4 6 4 -6 4Z M110 12 l6 -4 6 4 -6 4Z" fill="#C3A36A"/><g transform="translate(100 18)" fill="#E7A2AD" stroke="#B44B63" stroke-width=".7"><path transform="rotate(-40)" d="M0 0 Q-4 -7 0 -13 Q4 -7 0 0Z"/><path transform="rotate(40)" d="M0 0 Q-4 -7 0 -13 Q4 -7 0 0Z"/><path d="M0 0 Q-5 -8 0 -16 Q5 -8 0 0Z"/></g></symbol>
</defs></svg>

<header class="top">
  <a class="brand" href="/"><svg width="32" height="28" viewBox="-30 -64 60 66" aria-hidden="true"><use href="#lotus"/></svg><span>Milan</span></a>
  <div style="display:flex;gap:18px;align-items:center">
    <button class="link" id="soundBtn" type="button" aria-pressed="true">Milan's voice: on</button>
    <a class="link hidden" id="toDash" href="/app">Back to dashboard</a>
  </div>
</header>

<main class="stage">
  <div class="steps hidden" id="steps" aria-label="Progress"></div>
  <section class="frame" id="frame" aria-live="polite"></section>
</main>

<script src="/static/voice.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FUNCTIONS = ['Engagement', 'Haldi', 'Mehendi', 'Sangeet', 'Wedding', 'Reception'];
const DEMO = { partner1: 'Riya', partner2: 'Arjun', dateISO: '2026-12-12', city: 'Nagpur', guests: 250, budgetPerPlate: 1000, functions: ['Haldi', 'Mehendi', 'Sangeet', 'Wedding', 'Reception'] };
const W = { partner1: '', partner2: '', dateISO: '', city: '', guests: null, budgetPerPlate: null, functions: ['Wedding'] };
let sound = true, step = -1, busy = false, editing = false;

// Four questions. Each one: what Milan asks, which fields it fills, and when it is complete.
const STEPS = [
  { label: 'Couple', ask: 'First things first. Whose wedding are we planning?', hint: 'Say both names, like “Riya and Arjun”.', keys: ['partner1', 'partner2'], ok: () => W.partner1 && W.partner2 },
  { label: 'Date & city', ask: () => `Lovely, ${W.partner1} and ${W.partner2}. When is the wedding, and in which city?`, hint: 'Like “12th December, in Nagpur”.', keys: ['dateISO', 'city'], ok: () => W.dateISO && W.city },
  { label: 'Guests & budget', ask: 'How many guests are you expecting, and what is your catering budget per plate?', hint: 'Like “About 250 guests, a thousand rupees a plate”.', keys: ['guests', 'budgetPerPlate'], ok: () => W.guests >= 10 && W.budgetPerPlate >= 100 },
  { label: 'Functions', ask: 'And last, which functions are you having?', hint: 'Like “Haldi, mehendi, sangeet, the wedding and a reception”.', keys: ['functions'], ok: () => W.functions.length > 0, manual: true },
];

// ---------- Voice ----------
const say = async (text) => {
  if (!sound) return;
  try {
    const r = await fetch('/api/say', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, language: 'en-IN' }) });
    const d = await r.json();
    if (r.ok) await MilanVoice.play(d.audio, (l) => setOrb('speaking', l));
  } catch (e) { console.warn(e); }
  if (!MilanVoice.recording) setOrb('idle');
};
function setOrb(state, lvl = 0) {
  const o = $('orb');
  if (!o) return;
  o.dataset.state = state;
  o.style.setProperty('--lvl', lvl.toFixed(3));
  const h = $('hint');
  if (h) h.textContent = { idle: 'Tap to answer', listening: 'Listening… tap when done', thinking: 'Milan is noting it down…', speaking: 'Milan is speaking' }[state];
}
$('soundBtn').onclick = () => {
  sound = !sound;
  $('soundBtn').textContent = `Milan's voice: ${sound ? 'on' : 'off'}`;
  $('soundBtn').setAttribute('aria-pressed', sound);
  if (!sound) MilanVoice.stopPlayback();
};

async function toggleTalk() {
  if (busy) return;
  if (MilanVoice.recording) return finishTalk();
  try {
    await MilanVoice.start({ level: (l) => setOrb('listening', l), autoStop: finishTalk });
    setOrb('listening');
    $('heard').textContent = '';
  } catch {
    showErr('Milan could not use your microphone. Allow microphone access, or just type your answers below.');
  }
}
async function finishTalk() {
  if (!MilanVoice.recording) return;
  const { wav, spoke } = MilanVoice.stop();
  if (!spoke) { setOrb('idle'); return; }
  busy = true;
  setOrb('thinking');
  try {
    const heard = (await (await fetch('/api/listen', { method: 'POST', headers: { 'content-type': 'audio/wav' }, body: wav })).json()).heard;
    if (!heard) { setOrb('idle'); $('heard').textContent = ''; busy = false; return say("Sorry, I didn't catch that. Could you say it again?"); }
    $('heard').textContent = heard;
    await understand(heard);
  } catch (e) { showErr('Something went wrong hearing that. Try again, or type below.'); setOrb('idle'); }
  busy = false;
}

async function understand(text) {
  const r = await fetch('/api/understand', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, question: askText(STEPS[step]) }) });
  const got = await r.json();
  if (!r.ok) throw new Error(got.error);
  const changed = [];
  for (const k of Object.keys(W)) {
    const v = got[k];
    if (v == null || (Array.isArray(v) && !v.length)) continue;
    if (k === 'functions') W.functions = [...new Set(v)];
    else W[k] = v;
    changed.push(k);
  }
  renderFields(changed);
  const s = STEPS[step];
  if (s.ok()) { setOrb('idle'); setTimeout(() => !editing && next(), s.manual ? 1600 : 900); }
  else {
    setOrb('idle');
    const missing = s.keys.filter((k) => !W[k] || (Array.isArray(W[k]) && !W[k].length));
    const words = { partner1: 'both names', partner2: 'both names', dateISO: 'the date', city: 'the city', guests: 'the number of guests', budgetPerPlate: 'the budget per plate' };
    const need = [...new Set(missing.map((k) => words[k]))].join(' and ');
    if (need) say(`Got it. And ${need}?`);
  }
}

// ---------- Screens ----------
const askText = (s) => (typeof s.ask === 'function' ? s.ask() : s.ask);
function words(text) { return text.split(' ').map((w, i) => `<span class="w" style="animation-delay:${i * 45}ms">${esc(w)}</span>`).join(' '); }
function showErr(msg) { const e = $('err'); if (e) { e.textContent = msg; e.classList.remove('hidden'); } }

function welcome() {
  $('steps').classList.add('hidden');
  $('frame').innerHTML = `<div class="view">
    <svg width="70" height="62" viewBox="-30 -64 60 66" aria-hidden="true"><use href="#lotus"/></svg>
    <p class="namaste">Namaste</p>
    <h1 class="q" style="margin-top:4px">I'm Milan. Let's set up <em>your wedding.</em></h1>
    <p class="lede">Four quick questions, and Milan is ready to call your vendors. Just talk, the way you would to a friend. Or type, if you prefer.</p>
    <div class="promise">
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A47A36" stroke-width="1.6"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Speak in English or Hindi</span>
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A47A36" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>About a minute</span>
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A47A36" stroke-width="1.6"><path d="M4 12l5 5L20 6"/></svg>Change anything later</span>
    </div>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px">
      <button class="btn pri" id="beginBtn">Let's begin <span class="arr">→</span></button>
    </div>
    <p style="margin:18px 0 0"><button class="link" id="demoBtn" type="button">Or fill in the demo wedding</button></p>
  </div>`;
  $('beginBtn').onclick = async () => { try { await MilanVoice.unlock(); } catch {} go(0); };
  $('demoBtn').onclick = async () => { try { await MilanVoice.unlock(); } catch {} Object.assign(W, structuredClone(DEMO)); finale(); };
}

function renderSteps() {
  $('steps').classList.remove('hidden');
  $('steps').innerHTML = STEPS.map((s, i) => `<div class="st ${i < step ? 'done' : i === step ? 'on' : ''}"><i></i><b>${s.label}</b></div>`).join('');
}

function go(i) {
  step = i;
  editing = false;
  renderSteps();
  const s = STEPS[i];
  const text = askText(s);
  $('frame').innerHTML = `<div class="view">
    <p class="cap">Question ${i + 1} of ${STEPS.length}</p>
    <h1 class="q">${words(text)}</h1>
    <div class="talk">${orbHTML('orb', 'Tap to answer by voice')}<p class="hint" id="hint">Tap to answer</p></div>
    <p class="heard" id="heard"></p>
    <p class="muted" style="font-size:14px;margin:4px 0 0">${esc(s.hint)}</p>
    <div class="fields" id="fields"></div>
    <div class="err hidden" id="err" role="alert"></div>
    <div class="nav">
      <button class="link" id="backBtn" type="button">${i ? '← Back' : '← Start'}</button>
      <button class="btn pri" id="nextBtn">${i === STEPS.length - 1 ? 'Set up my wedding' : 'Continue'} <span class="arr">→</span></button>
    </div>
  </div>`;
  $('orb').onclick = toggleTalk;
  $('backBtn').onclick = () => (i ? go(i - 1) : welcome());
  $('nextBtn').onclick = () => { if (validateStep()) next(); };
  renderFields([]);
  setOrb('idle');
  say(text);
}

function next() {
  if (MilanVoice.recording) MilanVoice.stop();
  if (step < STEPS.length - 1) go(step + 1); else finale();
}

function renderFields(changed) {
  const f = $('fields');
  if (!f) return;
  const flash = (k) => (changed.includes(k) ? ' filled' : '');
  const k = STEPS[step].keys;
  if (k[0] === 'partner1') f.innerHTML = `<div class="full"><label for="p1">Whose wedding</label><div class="amp"><input class="input${flash('partner1')}" id="p1" placeholder="Riya" maxlength="40" value="${esc(W.partner1)}"><span>&amp;</span><input class="input${flash('partner2')}" id="p2" aria-label="Second name" placeholder="Arjun" maxlength="40" value="${esc(W.partner2)}"></div></div>`;
  if (k[0] === 'dateISO') f.innerHTML = `<div><label for="date">Wedding date</label><input class="input${flash('dateISO')}" id="date" type="date" value="${esc(W.dateISO)}"></div><div><label for="city">City</label><input class="input${flash('city')}" id="city" placeholder="Nagpur" maxlength="60" value="${esc(W.city)}"></div>`;
  if (k[0] === 'guests') f.innerHTML = `<div><label for="guests">Guests</label><input class="input${flash('guests')}" id="guests" type="number" inputmode="numeric" placeholder="250" value="${W.guests ?? ''}"></div><div><label for="budget">Catering per plate</label><div class="prefix"><span>₹</span><input class="input${flash('budgetPerPlate')}" id="budget" type="number" inputmode="numeric" placeholder="1000" value="${W.budgetPerPlate ?? ''}"></div></div><p class="sum" id="sum"></p>`;
  if (k[0] === 'functions') f.innerHTML = `<div class="full chips" id="chips">${FUNCTIONS.map((x) => `<button type="button" class="chip" aria-pressed="${W.functions.includes(x)}" data-f="${x}">${x}</button>`).join('')}</div>`;
  const bind = (id, key, num) => { const el = $(id); if (el) el.oninput = () => { editing = true; W[key] = num ? (el.value ? Number(el.value) : null) : el.value.trim(); updateSum(); }; };
  bind('p1', 'partner1'); bind('p2', 'partner2'); bind('date', 'dateISO'); bind('city', 'city'); bind('guests', 'guests', true); bind('budget', 'budgetPerPlate', true);
  f.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => {
    editing = true;
    const x = b.dataset.f;
    W.functions = W.functions.includes(x) ? W.functions.filter((y) => y !== x) : FUNCTIONS.filter((y) => y === x || W.functions.includes(y));
    b.setAttribute('aria-pressed', W.functions.includes(x));
  }));
  updateSum();
}
function updateSum() {
  const s = $('sum');
  if (s) s.textContent = W.guests > 0 && W.budgetPerPlate > 0 ? `A catering budget of ₹${(W.guests * W.budgetPerPlate).toLocaleString('en-IN')}. Milan asks you before going over it.` : '';
}
function validateStep() {
  const s = STEPS[step];
  if (s.ok()) return true;
  const msgs = ['Please add both names.', 'Please add the date and the city.', 'Please add the guests (at least 10) and the budget per plate (at least ₹100).', 'Pick at least one function.'];
  showErr(msgs[step]);
  return false;
}

async function finale() {
  step = STEPS.length;
  renderSteps();
  const nice = new Date(`${W.dateISO}T00:00:00`).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('frame').innerHTML = `<div class="view">
    <p class="cap">Almost there</p>
    <h1 class="q">Setting up <em>your wedding</em></h1>
    <ul class="checks" id="checks">
      <li><i>✓</i>Saving your wedding details</li>
      <li><i>✓</i>Reading Milan's rules from Flagsmith</li>
      <li><i>✓</i>Getting your caterers ready to call</li>
    </ul>
    <div class="invite hidden" id="invite">
      <p class="cap">The wedding of</p>
      <div class="names">${esc(W.partner1)} &amp; ${esc(W.partner2)}</div>
      <svg class="orn" viewBox="0 0 200 24" aria-hidden="true"><use href="#orn"/></svg>
      <p class="serif" style="font-size:22px;margin:8px 0 0;color:var(--head)">${esc(nice)} · ${esc(W.city)}</p>
      <div class="meta"><span class="tag gold">${W.guests} guests</span><span class="tag gold">₹${Number(W.budgetPerPlate).toLocaleString('en-IN')} a plate</span>${W.functions.map((f) => `<span class="tag">${esc(f)}</span>`).join('')}</div>
    </div>
    <div class="err hidden" id="err" role="alert"></div>
    <div style="margin-top:28px" class="hidden" id="openWrap"><a class="btn pri" href="/app" id="openBtn">Open my dashboard <span class="arr">→</span></a></div>
  </div>`;
  const items = [...$('checks').children];
  const tick = (n) => items[n]?.classList.add('ok');
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    const res = await fetch('/api/wedding', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(W) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    tick(0); await pause(500); tick(1); await pause(500); tick(2); await pause(400);
    $('invite').classList.remove('hidden');
    $('invite').classList.add('rise');
    $('openWrap').classList.remove('hidden');
    $('openBtn').focus({ preventScroll: true });
    say(`All set, ${W.partner1} and ${W.partner2}. Your dashboard is ready. Tell me what you need, and I'll take it from there.`);
  } catch (e) {
    showErr(e.message || 'Could not save. Try again.');
    $('frame').querySelector('.view').insertAdjacentHTML('beforeend', '<p style="margin-top:14px"><button class="link" onclick="go(0)">Go back and check the answers</button></p>');
  }
}

})();
